services:
  postgres:
    image: postgres:18
    container_name: finance-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_manager}
      POSTGRES_USER: ${POSTGRES_USER:-finance_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_manager_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: